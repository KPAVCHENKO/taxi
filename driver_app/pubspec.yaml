name: kazanskoe_driver
description: "Приложение водителя «Казанское Такси»"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Состояние
  flutter_riverpod: ^2.5.1

  # Сеть
  dio: ^5.4.3+1

  # Хранилище
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Push / Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Фон / смена
  flutter_foreground_task: ^8.10.0

  # Разрешения и настройки
  permission_handler: ^11.3.1

  # Прочее
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  intl: ^0.19.0
  vibration: ^2.0.0
  flutter_ringtone_player: ^4.0.0+3
  open_filex: ^4.5.0
  device_info_plus: ^10.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
